<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login • Nova App</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page">
      <section class="login-card" aria-labelledby="login-title">
        <header class="brand">
          <div class="logo" aria-hidden="true">N</div>
          <div>
            <p class="brand-kicker">Welcome back</p>
            <h1 id="login-title">Nova App</h1>
          </div>
        </header>

        <form id="loginForm" class="login-form" novalidate>
          <div class="field-group">
            <label for="email">Email</label>
            <input
              id="email"
              name="email"
              type="email"
              autocomplete="email"
              placeholder="you@example.com"
              required
            />
            <p class="error" id="emailError" aria-live="polite"></p>
          </div>

          <div class="field-group">
            <label for="password">Password</label>
            <div class="password-wrap">
              <input
                id="password"
                name="password"
                type="password"
                autocomplete="current-password"
                placeholder="Enter your password"
                minlength="6"
                required
              />
              <button
                type="button"
                class="toggle-password"
                id="togglePassword"
                aria-label="Show password"
                aria-pressed="false"
              >
                Show
              </button>
            </div>
            <p class="error" id="passwordError" aria-live="polite"></p>
          </div>

          <div class="row between">
            <label class="checkbox-wrap" for="remember">
              <input type="checkbox" id="remember" name="remember" />
              <span>Remember me</span>
            </label>
            <a class="link" href="#" aria-label="Forgot password">Forgot password?</a>
          </div>

          <button id="loginBtn" class="btn btn-primary" type="submit">
            <span class="btn-text">Login</span>
            <span class="spinner" aria-hidden="true"></span>
          </button>

          <p class="success" id="successMessage" aria-live="polite"></p>

          <div class="divider" role="presentation">
            <span>or continue with</span>
          </div>

          <div class="social-actions">
            <button type="button" class="btn btn-social" aria-label="Continue with Google">
              <span class="social-icon" aria-hidden="true">G</span>
              Google
            </button>
            <button type="button" class="btn btn-social" aria-label="Continue with GitHub">
              <span class="social-icon" aria-hidden="true">🐙</span>
              GitHub
            </button>
          </div>

          <p class="signup-hint">
            Don’t have an account?
            <a class="link" href="#">Sign up</a>
          </p>
        </form>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
